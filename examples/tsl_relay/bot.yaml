name: tsl_relay
# ⚠ DEPRECATED（TOB-522）：收款监听请改用 examples/afk_guard（relay.lua）；
#   本包仅保留绑定/验证码链路参考，不再演进。
scripts: [main.lua]
net:
  - "http://127.0.0.1:18100/*"
params:
  service_token:    { type: string, default: '', desc: 平台服务令牌（BOTPLATFORM_SERVICE_TOKEN，必填） }
  api_base:         { type: string, default: 'http://127.0.0.1:18100', desc: 控制面地址 }
  bot_player:       { type: string, default: 'MixTobyInjSave', desc: bot 进服玩家名（私聊接收方校验 + 转账收款方） }
  transfer_pattern: { type: string, default: '([%a%d_]+) 向 MixTobyInjSave 转账 ([%d%.]+)', desc: TSLC 转账识别（捕获：玩家名、金额） }
persist: ./data/tsl_relay.sqlite
