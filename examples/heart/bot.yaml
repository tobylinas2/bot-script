# 心形绘制 bot —— 脚本包清单（能力自述；边界/连接在实例部署配置，DESIGN §6）
# source/target 等实例坐标不在此：运行期经控制渠道（HTTP /params、GUI）设置后持久化
# heart-boot.lua 为模块：无方块事件流宿主（fabric）由它读 params.target 引导触发
name: heart-1
scripts: [heart.lua]
params:
  range:    { type: number,   default: 32, visible: true, help: "侦测半径（格）" }
  source:   { type: blockpos, required: true, help: "原材料箱" }
  target:   { type: blockpos, help: "目标双箱（无事件流宿主引导用）" }
  material: { type: string,   default: minecraft:pink_wool, help: "摆放材料" }
persist: ./data/heart-1.sqlite
