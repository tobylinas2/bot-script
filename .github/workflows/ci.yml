name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine（测试 + 包校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 冒烟测试（mock 驱动全栈）
        run: node engine/test/run.js
      - name: 包静态校验（全部示例包）
        run: |
          for d in examples/*/; do
            node engine/cli.js validate "$d" || exit 1
          done

  mod:
    name: fabric mod 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle build
        run: |
          cd mod
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: botscript-mod
          path: mod/build/libs/botscript-mod-*.jar
          if-no-files-found: error
