name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 构建 fabric mod jar 并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle build
        run: |
          cd mod
          chmod +x gradlew
          ./gradlew build
      - name: 收集产物（主 jar，不含 sources）
        run: |
          mkdir -p release
          find mod/build/libs -maxdepth 1 -name 'botscript-mod-*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          ls -la release
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
